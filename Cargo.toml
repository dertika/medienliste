[package]
name = "medienliste"
version = "0.1.0"
edition = "2024"
description = "Selbst gehostete Webapp zum Tracken von Büchern, Hörbüchern und Filmen"
publish = false

[dependencies]
anyhow = "1.0.104"
askama = "0.14"
async-trait = "0.1.92"
axum = { version = "0.8", features = ["multipart", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
fluent-bundle = "0.16.0"
hex = "0.4.3"
ipnet = "2.12.2"
mime_guess = "2.0.5"
openidconnect = "4.0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
roxmltree = "0.21.2"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unic-langid = "0.9.6"
url = "2.5.8"
urlencoding = "2.1.3"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4
